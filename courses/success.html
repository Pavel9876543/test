<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Заявка отправлена</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #eefbf3, #f5f7fb);
      color: #172033;
    }
    .card {
      width: min(100%, 560px);
      background: #fff;
      padding: 34px;
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, .10);
      text-align: center;
    }
    .icon {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #dcfce7;
      color: #166534;
      font-size: 34px;
      font-weight: 900;
    }
    h1 { margin: 0 0 12px; font-size: 32px; }
    p { margin: 0; color: #64748b; line-height: 1.65; }
    a {
      display: inline-block;
      margin-top: 24px;
      padding: 13px 18px;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">✓</div>
    <h1>Заявка отправлена</h1>
    <p>Спасибо за регистрацию. Администратор получил данные и свяжется с вами для подтверждения записи.</p>
    <a href="./">Вернуться к форме</a>
  </main>
</body>
</html>
